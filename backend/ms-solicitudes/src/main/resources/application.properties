spring.application.name=ms-solicitudes
server.port=8081

# Base de datos H2 guardada en un archivo (no se pierde al apagar)
spring.datasource.url=jdbc:h2:file:./data/solicitudesdb
spring.datasource.username=sa
spring.datasource.password=

# Crea o actualiza la tabla segun la entidad
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console